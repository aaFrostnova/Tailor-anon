# Fingerprint generation configuration

# Data paths
data:
  root: "/project/pi_shiqingma_umass_edu/mingzheli/datasets"

# Master key settings
key:
  # Length in bytes (32 = AES-256)
  length: 32
  # KDF algorithm: "hkdf-sha256"
  kdf: "hkdf-sha256"

# Fragment settings
fragments:
  # Number of fragments per image (K)
  num_fragments: 8
  # Perturbation budget epsilon (in [0, 1] scale, e.g., 4/255 ≈ 0.0157)
  epsilon: 0.0157
  # Per-fragment scaling weights (uniform if null)
  weights: null

# Embedding strategy: "pixel", "dct", "dwt-dct"
embedding:
  strategy: "dwt-dct"
  # DCT settings
  dct:
    block_size: 8
    # Mid-frequency coefficient indices (zigzag order)
    freq_range: [10, 40]
  # DWT settings
  dwt:
    wavelet: "haar"
    level: 2

# Quality targets (for validation only)
quality:
  min_psnr: 40.0
  min_ssim: 0.98
  max_lpips: 0.06
